schema: spec-driven

context: |
  Horror Hunter — игра на Java 8 и libGDX; Gradle Wrapper использует JDK 21.
  Документация, требования и обсуждения ведутся на русском языке.
  Имена в коде, команды и технические обозначения — на английском.
  domain — чистая Java, не зависит от libGDX, платформ и внешних адаптеров.
  core интегрирует libGDX и зависит от domain; lwjgl3 и android запускают игру.
  Соблюдай AGENTS.md и указанный в нём ADR-001. Порты создавай по необходимости.
  Игровые правила согласовываются с владельцем до реализации.
  openspec/specs описывает только реализованное и принятое поведение.
  Будущие изменения планируются в openspec/changes; идеи не считаются реализацией.
  В domain настроен JUnit Jupiter 5; проверка: ./gradlew :domain:test.
  Проверка интеграции: ./gradlew :core:classes :lwjgl3:classes.

rules:
  proposal:
    - Укажи цель, границы задачи и проверяемые критерии приёмки.
  specs:
    - Пиши согласованные требования на русском, сохраняя служебные маркеры OpenSpec.
  design:
    - Объясни соблюдение границ domain и интеграционных модулей.
  tasks:
    - Включи соответствующие тесты и отчёт о проверках и ограничениях.
